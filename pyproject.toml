[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roon-bridge"
version = "0.1.0"
description = "Small HTTP API for one Roon zone: volume, transport and a live event stream, for buttons and dials"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # pyroon, the library Home Assistant uses. Last release Dec 2023 and
    # synchronous: pinned exactly, bump deliberately.
    "roonapi==0.1.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
roon-bridge = "roon_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roon_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
